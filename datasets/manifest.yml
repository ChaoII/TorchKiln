# 数据集清单(供 tools/download_dataset.py / 文档使用)
#
# 仓库只入库 label 文本;图片打包在 ModelScope。填好 url 后:
#     tkiln data list            # 查看状态
#     tkiln data get <name>      # 下载 + 解包到 datasets/<name>/
#
# layout: 解包后期望的目录结构
#   images/ + train.txt + val.txt       (常规)
#   见 datasets/README.md 的格式表

defaults:
  # 同一 ModelScope 仓库下的统一前缀
  prefix: "https://www.modelscope.cn/models/ChaoII0987/PytorchOCR/resolve/master/datasets/"

datasets:
  det_demo:
    task: detect
    layout: images+txt
    url: null
  obb_demo:
    task: obb
    layout: images+txt
    url: null
  seg_demo:
    task: segment
    layout: images+masks+txt
    url: null
  pose_demo:
    task: pose
    layout: images+txt
    url: null
  cls_demo:
    task: classify
    layout: images+txt
    url: null
  sem_demo:
    task: semantic
    layout: images+masks+txt
    url: null
  depth_demo:
    task: depth
    layout: images+depth+txt
    url: null
  plate_det_demo:
    task: plate_det
    layout: images+txt
    url: null
  plate_rec_demo:
    task: plate_rec
    layout: images+txt
    url: null
  pedestrian_attribute_demo:
    task: attribute
    layout: images+txt
    url: null
  vehicle_attribute_demo:
    task: attribute
    layout: images+txt
    url: null
  ocr_det_dataset_examples:
    task: ocr_det
    layout: images+txt
    url: null
  ocr_rec_dataset_examples:
    task: ocr_rec
    layout: images+txt
    url: null
