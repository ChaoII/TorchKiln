# SqueezeSegV3 —— **官方 SemanticKITTI 预训练**（20 类，与 Paddle3D 数值对齐）
#
# 与 `squeezesegv3-pcseg.yml`（5 类合成 demo）的区别：
#   - `num_classes: 20`（SemanticKITTI 官方 = **19 语义类 + 1 unlabeled**）
#     ⇒ 只有 20 类才能加载官方权重（分类头形状才匹配，已实测 missing=0）
#   - 挂上官方预训练 `squeezesegv3_rangenet53_semantickitti`
#
# ⚠️ **需要自备 SemanticKITTI 数据**（`datasets/` 不入库）：
#   - 原始包（AGENTS 记录）：
#       data_odometry_velodyne.zip (80.9 GB)  → 点云序列
#       data_odometry_calib.zip    (0.6 MB)   → 标定（外参）
#       data_odometry_labels.zip   (171 MB)   → 点级标签（19 类，0..18，-1=unlabeled）
#   - 训练前需自行转成框架格式（见 `docs/models/pc/squeezesegv3.md` 的「数据管线」节）：
#       每帧一个 `.npy`（N,4 或 N,5）点云 + 每帧一个点级标签 `.npy`（N,）
#       再写 `train.txt` / `val.txt` 清单
#   - 标签编码：框架按 `num_classes: 20` 直接用 0..19；
#       **SemanticKITTI 原始 0..18 + -1(unlabeled) 需重映射**
#       （建议：0 保留给 unlabeled，1..19 对应原始 0..18，`ignore_index: 255` 丢无效点）
#
# 用时改：`Train/Eval` 的 `data_dir` + `label_file_list`（其它不用动）。

Global:
  model_name: squeezesegv3-semantickitti
  use_gpu: true
  device: cuda:0
  epoch_num: 50
  print_batch_step: 10
  save_model_dir: ./output/squeezesegv3-semantickitti
  save_epoch_step: 10
  eval_batch_step: [0, 2000]
  eval_epoch_step: 1
  # ★ 官方权重（ModelScope ChaoII0987/TorchKiln -> pretrained/，裸名自动下载）
  #   实测：612 张量全命中，missing=0 / unexpected=0（25.960 M 参数）
  pretrained_model: squeezesegv3_rangenet53_semantickitti
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: false
  show_eval_progress: true

Architecture:
  model_family: pc
  task: pc_seg
  algorithm: squeezesegv3
  Head:
    num_classes: 20          # ★ 20 = 19 语义类 + unlabeled（与官方权重一致）
    in_channels: 5           # range-view 5 通道（x,y,z,intensity,ring），与官方一致
    num_layers: 53
    encoder_dropout_prob: 0.01
    decoder_dropout_prob: 0.01

Optimizer:
  name: AdamW
  lr:
    name: Cosine
    learning_rate: 0.001
    lrf: 0.05
    warmup_epoch: 2
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
  regularizer:
    name: L2
    factor: 0.0001

Loss:
  name: SqueezeSegV3Loss
  ignore_index: 255

Metric:
  name: SemMetric
  main_indicator: mIoU
  num_classes: 20
  ignore_index: 255

PostProcess:
  name: SqueezeSegV3PostProcess

Train:
  dataset:
    name: PointCloudDataset
    data_dir: datasets/semantickitti            # ← 自备数据
    label_file_list: [datasets/semantickitti/train.txt]
    range_image: true
    range_image_h: 64                            # 官方 Paddle3D 用 64x512；
    range_image_w: 256                           # 这里保持 64x256（显存友好、已验证可跑；
                                                #  网络全为 conv+convtranspose+crop，尺寸可变）
    num_classes: 20
    ignore_index: 255
  loader:
    batch_size_per_card: 1
    shuffle: true
    drop_last: false
    num_workers: 4                              # ⚠️ Windows 上别开太大（全分辨率 mask 易 OOM）
    prefetch_factor: 2

Eval:
  dataset:
    name: PointCloudDataset
    data_dir: datasets/semantickitti
    label_file_list: [datasets/semantickitti/val.txt]
    range_image: true
    range_image_h: 64
    range_image_w: 256
    num_classes: 20
    ignore_index: 255
  loader:
    batch_size_per_card: 1
    shuffle: false
    drop_last: false
    num_workers: 0                              # ⚠️ Windows 上 eval 用 0（否则 worker 异常退出）
    prefetch_factor: 2
