Global:
  model_name: YOLO11n_obb
  debug: false
  use_gpu: true
  device: null
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/YOLO11n_obb
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 2000
  pretrained_model: null
  checkpoints: null
  output: null
  distributed: false
  dist_backend: null
  dist_init_method: null
  seed: 1024
  use_ema: true
  ema_decay: 0.9998
  ema_decay_type: threshold
  show_eval_progress: true
Architecture:
  model_family: yolo
  task: obb
  algorithm: YOLOObb
  Backbone:
    name: DetBackbone
    scale: n
    in_channels: 3
  Neck:
    name: PAN
    depth_mult: 0.33
  Head:
    name: DetectHead
    num_classes: 2
    reg_channels: 5
    hidden: 64
    prior_prob: 0.01
Optimizer:
  name: SGD
  momentum: 0.937
  nbs: 64
  lr:
    name: Linear
    learning_rate: 0.01
    lrf: 0.01
    warmup_epoch: 3
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
  regularizer:
    name: L2
    factor: 0.0005
Loss:
  name: ObbLoss
  strides:
  - 8
  - 16
  - 32
  topk: 10
  alpha: 0.5
  beta: 6.0
  cls_gain: 0.5
  box_gain: 7.5
Metric:
  name: DetMetric
  main_indicator: mAP50-95
  box_format: xywhr
PostProcess:
  name: DetPostProcess
  conf_thres: 0.001
  iou_thres: 0.5
  max_det: 300
  box_type: xywhr
  strides:
  - 8
  - 16
  - 32
Train:
  dataset:
    name: DetDataset
    data_dir: datasets/obb_demo
    label_file_list:
    - datasets/obb_demo/train.txt
    box_format: xywhr
    names:
    - rect_a
    - rect_b
    transform:
      image_size: 320
  loader:
    batch_size_per_card: 8
    shuffle: true
    drop_last: false
    num_workers: 4
    prefetch_factor: 4
Eval:
  dataset:
    name: DetDataset
    data_dir: datasets/obb_demo
    label_file_list:
    - datasets/obb_demo/val.txt
    box_format: xywhr
    names:
    - rect_a
    - rect_b
    transform:
      image_size: 320
  loader:
    batch_size_per_card: 8
    shuffle: false
    num_workers: 0
    prefetch_factor: 4
