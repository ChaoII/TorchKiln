# 车道线-行式(lane_row,UFLD 风格):每行分类 x bin,metric 为 F1/acc。
# 标签: labels/<split>/*.txt,每行 `valid x0..x_{R-1}`(x∈[0,1],R=num_rows)。
# 用时改:Head.num_lanes/num_rows/num_bins、Train/Eval data_dir + label_file_list、image_size、batch。
Global:
  model_name: yolo11-lane-row
  use_gpu: true
  device: cuda:0
  epoch_num: 100
  print_batch_step: 10
  save_model_dir: ./output/yolo11-lane-row
  save_epoch_step: 10
  eval_batch_step: [0, 2000]
  eval_epoch_step: 1
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: true
  ema_decay: 0.9999
  ema_decay_type: exponential
  show_eval_progress: true
Architecture:
  model_family: yolo
  task: lane_row
  algorithm: yolo11
  yaml_file: torchkiln/cfg/models/11/yolo11-lane-row.yaml
  scale: n
  in_channels: 3
  Head:
    num_classes: 6          # = num_lanes
    num_lanes: 6
    num_rows: 100           # 行数(竖直采样)
    num_bins: 101           # 横坐标 bin 数(UFLD 常用 101)
Optimizer:
  name: SGD
  momentum: 0.937
  nbs: 64
  lr:
    name: Linear
    learning_rate: 0.01
    lrf: 0.01
    warmup_epoch: 3
    warmup_bias_lr: 0.1
  regularizer:
    name: L2
    factor: 0.0005
Loss:
  name: LaneRowLoss
  ignore_index: -100
Metric:
  name: LaneRowMetric
  main_indicator: F1
  threshold_px: 50
PostProcess:
  name: LaneRowPostProcess
  ignore_value: -1.0
Train:
  dataset:
    name: LaneRowDataset
    data_dir: datasets/lane_row_demo            # ← 数据根目录
    label_file_list: [datasets/lane_row_demo/train.txt]
    num_lanes: 6
    num_rows: 100
    kpt_shape: null
    transform:
      image_size: 256                          # 须为 32 倍数
  loader:
    batch_size_per_card: 8
    shuffle: true
    drop_last: false
    num_workers: 4
    prefetch_factor: 4
Eval:
  dataset:
    name: LaneRowDataset
    data_dir: datasets/lane_row_demo
    label_file_list: [datasets/lane_row_demo/val.txt]
    num_lanes: 6
    num_rows: 100
    kpt_shape: null
    transform:
      image_size: 256                          # ← 与 Train 一致
  loader:
    batch_size_per_card: 8
    shuffle: false
    drop_last: false
    num_workers: 0
    prefetch_factor: 4
