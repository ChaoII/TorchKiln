# 通用模板：单标签分类（single-label / CrossEntropy）。业务实验复制到 configs/local/ 再改。
# 用时改：Head.num_classes、Train/Eval data_dir + label_file_list、image_size、batch。
# 多标签：加 -o Loss.multi_label=true（见 docs/USER_GUIDE.md §3.7），无需另存模板。
Global:
  model_name: yolo11-cls
  use_gpu: true
  device: cuda:0
  epoch_num: 100
  print_batch_step: 10
  save_model_dir: ./output/yolo11-cls
  save_epoch_step: 10
  eval_batch_step: [0, 2000]
  eval_epoch_step: 1
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: true
  ema_decay: 0.9999
  ema_decay_type: exponential
  show_eval_progress: true
Architecture:
  model_family: yolo
  task: classify
  algorithm: yolo11-cls
  yaml_file: torchkiln/cfg/models/11/yolo11-cls.yaml
  scale: n          # n/s/m/l/x
  in_channels: 3
  Head:
    num_classes: 3   # ← 类别数
    reg_max: 1
Optimizer:
  name: SGD
  momentum: 0.937
  nbs: 64
  lr:
    name: Linear
    learning_rate: 0.01
    lrf: 0.01
    warmup_epoch: 3
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
  regularizer:
    name: L2
    factor: 0.0005
Loss:
  name: CrossEntropy
  topk: 10
  alpha: 0.5
  beta: 6.0
  cls_gain: 0.5
  box_gain: 7.5
Metric:
  name: ClsMetric
  main_indicator: acc
PostProcess:
  name: ClsPostProcess
  conf_thres: 0.001
  iou_thres: 0.7
  strides: [8, 16, 32]
Train:
  dataset:
    name: ClsDataset
    data_dir: datasets/cls_demo                 # ← 数据根目录
    label_file_list: [datasets/cls_demo/train.txt]
    kpt_shape: null
    transform:
      image_size: 224                           # int=方图; [h,w] 非方(边长%32==0)
  loader:
    batch_size_per_card: 32
    shuffle: true
    drop_last: false
    num_workers: 4
    prefetch_factor: 4
Eval:
  dataset:
    name: ClsDataset
    data_dir: datasets/cls_demo
    label_file_list: [datasets/cls_demo/val.txt]
    kpt_shape: null
    transform:
      image_size: 224                           # ← 与 Train 一致
  loader:
    batch_size_per_card: 64
    shuffle: false
    drop_last: false
    num_workers: 0
    prefetch_factor: 4
