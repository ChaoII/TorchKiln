Global:
  model_name: YOLO11n_cls
  debug: false
  use_gpu: true
  device: null
  epoch_num: 10
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/YOLO11n_cls
  save_epoch_step: 5
  eval_batch_step:
  - 0
  - 2000
  pretrained_model: null
  checkpoints: null
  output: null
  distributed: false
  dist_backend: null
  dist_init_method: null
  seed: 1024
  use_ema: true
  ema_decay: 0.9998
  ema_decay_type: threshold
  show_eval_progress: true
Architecture:
  model_family: yolo
  task: classify
  algorithm: YOLOCls
  Backbone:
    name: YOLOBackbone
    scale: n
    in_channels: 3
  Neck: null
  Head:
    name: ClassifyHead
    num_classes: 3
    hidden: 256
    dropout: 0.0
Optimizer:
  name: SGD
  momentum: 0.937
  nbs: 64
  lr:
    name: Linear
    learning_rate: 0.01
    lrf: 0.01
    warmup_epoch: 3
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
  regularizer:
    name: L2
    factor: 0.0005
Loss:
  name: CrossEntropy
Metric:
  name: ClsMetric
  main_indicator: acc
  topk:
  - 1
  - 3
PostProcess:
  name: ClsPostProcess
  topk: 3
Train:
  dataset:
    name: ClsDataset
    data_dir: datasets/ocr_rec_dataset_examples
    label_file_list:
    - datasets/cls_demo/train.txt
    transform:
      image_size: 128
  loader:
    batch_size_per_card: 16
    shuffle: true
    drop_last: false
    num_workers: 4
    prefetch_factor: 4
Eval:
  dataset:
    name: ClsDataset
    data_dir: datasets/ocr_rec_dataset_examples
    label_file_list:
    - datasets/cls_demo/val.txt
    transform:
      image_size: 128
  loader:
    batch_size_per_card: 16
    shuffle: false
    num_workers: 0
    prefetch_factor: 4
