# PANNs CNN14 + ESC-50 **决定性对照（30 epoch）** 配置（torchkiln 侧）
# 与 `_downloads/panns_paddle_ctrl30.py` 严格同条件：
#   * shuffle: false  -> 同数据顺序（CSV 顺序）
#   * dropout: 0.0    -> 无 RNG mask 差异
#   * weights_path    -> Paddle 侧存的**完整**初始权重（含 50 类头 fc）-> 严格同起点
# 这是检验「两侧训练实现等价」的决定性实验：若轨迹重合 -> 实现对齐成立。
Global:
  model_name: panns_esc50_ctrl30
  debug: false
  use_gpu: true
  device: null
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/panns_esc50_ctrl30
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 1000
  cal_metric_during_train: false
  pretrained_model: null
  checkpoints: null
  save_inference_dir: null
  output: null
  use_visualdl: false
  infer_img: null
  distributed: false
  seed: 1024
  use_ema: false
  ema_decay: 0.9998
  ema_decay_type: threshold
  show_eval_progress: true
  amp: false
Architecture:
  task: panns_cls
  algorithm: panns
  num_class: 50
  dropout: 0.0
  weights_path: _downloads/speech/panns_train/ctrl30_init_torch.npz
  feature:
    sr: 32000
    n_fft: 1024
    hop_length: 320
    win_length: 1024
    window: hann
    f_min: 50.0
    f_max: 14000.0
    n_mels: 64
Loss:
  name: CrossEntropyLoss
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  # ⚠️ PaddleSpeech 的 PANNs 训练循环**不做梯度裁剪**（实测梯度范数 81~94），
  #    而框架默认 clip_grad_norm=10.0（对齐 ultralytics）-> 这里设 null 关闭以对齐。
  clip_grad_norm: null
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Metric:
  name: PannsClsMetric
Train:
  dataset:
    name: ESC50Dataset
    data_dir: datasets/esc50
    split: 1
    sample_rate: 32000
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 4
    prefetch_factor: 4
Eval:
  dataset:
    name: ESC50Dataset
    data_dir: datasets/esc50
    split: 1
    sample_rate: 32000
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    # ⚠️ Windows 上 eval 的多进程 worker 会 "exited unexpectedly"（框架已知问题），
    #    评估用 0 worker（训练仍用 4）。
    num_workers: 0
    prefetch_factor: 2
profiler_options: null
