# PANNs CNN14 + ESC-50 **确定性对照**配置（torchkiln 侧）
# 目的：消除随机性后检验两侧逐 epoch 轨迹是否几乎重合。
#   * shuffle: false     -> 与 Paddle 侧同序（CSV 顺序），mini-batch 完全相同
#   * dropout: 0.0       -> 无 RNG mask 差异
#   * weights_path 指向 Paddle 侧存的**完整**初始权重（含 50 类分类头 fc）-> 严格同起点
# 其余同 `panns_esc50_align.yml`：Adam lr=1e-3, batch=32, fold=1(dev), num_class=50。
Global:
  model_name: panns_esc50_ctrl
  debug: false
  use_gpu: true
  device: null
  epoch_num: 10
  log_smooth_window: 20
  print_batch_step: 5
  save_model_dir: ./output/panns_esc50_ctrl
  save_epoch_step: 5
  eval_batch_step:
  - 0
  - 1000
  cal_metric_during_train: false
  pretrained_model: null
  checkpoints: null
  save_inference_dir: null
  output: null
  use_visualdl: false
  infer_img: null
  distributed: false
  seed: 1024
  use_ema: false
  ema_decay: 0.9998
  ema_decay_type: threshold
  show_eval_progress: true
  amp: false
Architecture:
  task: panns_cls
  algorithm: panns
  num_class: 50
  dropout: 0.0
  # Paddle 侧 ctrl 脚本存的「完整初始权重」，含分类头 -> 严格同起点
  weights_path: _downloads/speech/panns_train/ctrl_init_torch.npz
  feature:
    sr: 32000
    n_fft: 1024
    hop_length: 320
    win_length: 1024
    window: hann
    f_min: 50.0
    f_max: 14000.0
    n_mels: 64
Loss:
  name: CrossEntropyLoss
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Metric:
  name: PannsClsMetric
Train:
  dataset:
    name: ESC50Dataset
    data_dir: datasets/esc50
    split: 1
    sample_rate: 32000
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
    prefetch_factor: 2
Eval:
  dataset:
    name: ESC50Dataset
    data_dir: datasets/esc50
    split: 1
    sample_rate: 32000
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
    prefetch_factor: 2
profiler_options: null
