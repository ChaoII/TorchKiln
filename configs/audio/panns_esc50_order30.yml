# PANNs CNN14 + ESC-50 **共享随机顺序**对照（30 epoch，torchkiln 侧）
# 与 `_downloads/panns_paddle_order30.py` 严格同条件：
#   * order_seed: 1024 -> 两侧用**同一 numpy 置换**打乱训练集顺序（可复现的"随机 shuffle"）
#                        这样训练处于"能学得动"的真实 regime（ESC-50 CSV 是 class-clustered）
#   * dropout: 0.0      -> 关闭**外层** dropout（CNN14 内置 dropout 无法关，见 AGENTS 说明）
#   * weights_path      -> Paddle 存的完整初始权重（含 50 类头）-> 严格同起点
#   * clip_grad_norm: null -> 与 PaddleSpeech 一致（不裁剪）
Global:
  model_name: panns_esc50_order30
  debug: false
  use_gpu: true
  device: null
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/panns_esc50_order30
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 1000
  cal_metric_during_train: false
  pretrained_model: null
  checkpoints: null
  save_inference_dir: null
  output: null
  use_visualdl: false
  infer_img: null
  distributed: false
  seed: 1024
  use_ema: false
  ema_decay: 0.9998
  ema_decay_type: threshold
  show_eval_progress: true
  amp: false
Architecture:
  task: panns_cls
  algorithm: panns
  num_class: 50
  dropout: 0.0
  weights_path: _downloads/speech/panns_train/order30_init_torch.npz
  feature:
    sr: 32000
    n_fft: 1024
    hop_length: 320
    win_length: 1024
    window: hann
    f_min: 50.0
    f_max: 14000.0
    n_mels: 64
Loss:
  name: CrossEntropyLoss
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  clip_grad_norm: null
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Metric:
  name: PannsClsMetric
Train:
  dataset:
    name: ESC50Dataset
    data_dir: datasets/esc50
    split: 1
    sample_rate: 32000
    order_seed: 1024
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 4
    prefetch_factor: 4
Eval:
  dataset:
    name: ESC50Dataset
    data_dir: datasets/esc50
    split: 1
    sample_rate: 32000
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
    prefetch_factor: 2
profiler_options: null
