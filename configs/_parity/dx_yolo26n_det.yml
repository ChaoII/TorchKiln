Global:
  model_name: dx_yolo26n
  debug: false
  use_gpu: true
  device: 'cuda:0'
  epoch_num: 6
  log_smooth_window: 20
  print_batch_step: 1
  save_model_dir: ./output/dx_yolo11n
  save_epoch_step: 1
  eval_batch_step: [0, 0]
  eval_epoch_step: 1
  pretrained_model: C:/Users/ADMINI~1/AppData/Local/Temp/1/opencode/yolo26n_nc1_state.pth
  checkpoints: null
  output: null
  distributed: false
  dist_backend: null
  dist_init_method: null
  seed: 0
  use_ema: true
  ema_decay: 0.9999
  ema_decay_type: exponential
  show_eval_progress: false
  amp: false
Architecture:
  model_family: yolo
  task: detect
  algorithm: yolo26
  yaml_file: torchkiln/cfg/models/26/yolo26.yaml
  scale: n
  in_channels: 3
  Head:
    num_classes: 1
    reg_max: 1
    end2end: true
Optimizer:
  name: SGD
  momentum: 0.937
  nbs: 2
  lr:
    name: Linear
    learning_rate: 0.01
    lrf: 0.01
    warmup_epoch: 0
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
  regularizer:
    name: L2
    factor: 0.0005
Loss:
  name: DetLoss
  strides: [8, 16, 32]
  topk: 10
  alpha: 0.5
  beta: 6.0
  cls_gain: 0.5
  box_gain: 7.5
  dfl_gain: 1.5
  use_one2one: true
  one2one_topk: 1
  one2one_gain: 1.0
Metric:
  name: DetMetric
  main_indicator: mAP50-95
PostProcess:
  name: DetPostProcess
  conf_thres: 0.001
  iou_thres: 0.7
  max_det: 300
  strides: [8, 16, 32]
  end2end: false
Train:
  dataset:
    name: DetDataset
    data_dir: datasets/dx_det
    label_file_list: [train.txt]
    names:
    - plate
    augment: false
    transform:
      image_size: 640
  loader:
    batch_size_per_card: 8
    shuffle: false
    drop_last: false
    num_workers: 0
    prefetch_factor: 4
Eval:
  dataset:
    name: DetDataset
    data_dir: datasets/dx_det
    label_file_list: [val.txt]
    names:
    - plate
    transform:
      image_size: 640
  loader:
    batch_size_per_card: 2
    shuffle: false
    drop_last: false
    num_workers: 0
    prefetch_factor: 4
