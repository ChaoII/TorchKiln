Global:
  model_name: parity_cls_demo
  use_gpu: true
  epoch_num: 10
  print_batch_step: 10
  save_model_dir: ./output/parity_cls_demo
  save_epoch_step: 10
  eval_batch_step: [0, 2000]
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: true
  ema_decay: 0.9999
  ema_decay_type: exponential
  show_eval_progress: true
Architecture:
  model_family: yolo
  task: classify
  algorithm: yolo11-cls
  yaml_file: torchkiln/cfg/models/11/yolo11-cls.yaml
  scale: n
  in_channels: 3
  Head:
    num_classes: 3
Optimizer:
  name: SGD
  momentum: 0.937
  nbs: 64
  lr:
    name: Linear
    learning_rate: 0.01
    lrf: 0.01
    warmup_epoch: 3
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
  regularizer:
    name: L2
    factor: 0.0005
Loss:
  name: CrossEntropy
Metric:
  name: ClsMetric
  topk: [1, 5]
  main_indicator: top1
PostProcess:
  name: ClsPostProcess
  topk: 5
Train:
  dataset:
    name: ClsDataset
    data_dir: datasets/cls_demo
    label_file_list: [datasets/cls_demo/train.txt]
    transform:
      image_size: 224
  loader:
    batch_size_per_card: 4
    shuffle: true
    drop_last: false
    num_workers: 0
    prefetch_factor: 4
Eval:
  dataset:
    name: ClsDataset
    data_dir: datasets/cls_demo
    label_file_list: [datasets/cls_demo/val.txt]
    transform:
      image_size: 224
  loader:
    batch_size_per_card: 4
    shuffle: false
    drop_last: false
    num_workers: 0
    prefetch_factor: 4
