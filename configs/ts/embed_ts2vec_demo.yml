# 时序表示学习 demo（ts2vec）—— 无标签数据 datasets/ts_embed_demo/data.csv
Global:
  model_name: ts-embed-ts2vec-demo
  use_gpu: true
  device: cuda:0
  epoch_num: 10
  print_batch_step: 20
  save_model_dir: ./output/ts_embed_ts2vec_demo
  save_epoch_step: 10
  eval_batch_step: null
  eval_epoch_step: 1
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: false
  show_eval_progress: false
Architecture:
  model_family: ts_embed
  task: ts_embed
  train: true
  algorithm: ts2vec
  in_chunk_len: 96
  num_features: 3
  hidden_dim: 32
  depth: 4
  output_dim: 64
  max_train_length: 96
Loss:
  name: TSReprLoss
Metric:
  main_indicator: loss
Optimizer:
  name: Adam
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    name: TSClassifyDataset
    csv_path: datasets/ts_embed_demo/data.csv
    label_col: __none__        # 无标签：留一个不存在的列名即可（解析时忽略）
    in_chunk_len: 96
    stride: 1
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
Eval:
  dataset:
    name: TSClassifyDataset
    csv_path: datasets/ts_embed_demo/data.csv
    label_col: __none__
    in_chunk_len: 96
    stride: 8
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
