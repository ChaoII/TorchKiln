# RUL 特征工程消融 —— FD001, feat_eng=[roll_mean, slope]
Global:
  model_name: ts-rul-fe-slope
  use_gpu: true
  device: cuda:0
  epoch_num: 80
  main_indicator_mode: min
  print_batch_step: 200
  save_model_dir: ./output/ts_rul_fe_slope
  save_epoch_step: 80
  eval_batch_step: null
  eval_epoch_step: 5
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: false
  show_eval_progress: false
Architecture:
  model_family: ts_rul
  task: ts_rul
  train: true
  Head:
    model: tcn
    in_chunk_len: 30
    out_chunk_len: 1
    hidden_dim: 128
    num_layers: 3
    kernel_size: 3
    dropout: 0.1
Loss:
  type: mse
  reduce: mean
Metric:
  main_indicator: RMSE
  score_tol: 10
  reduce: mean
Optimizer:
  name: Adam
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    name: RULDataset
    format: cmapss
    data_dir: datasets/cmapss
    train_file: train_FD001.txt
    test_file: test_FD001.txt
    rul_file: RUL_FD001.txt
    window: 30
    stride: 1
    max_rul: 125
    train_last_frac: 0.5
    auto_select: true
    standardize: true
    feat_eng: [roll_mean, slope]
    roll_window: 10
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 256
    num_workers: 0
Eval:
  dataset:
    name: RULDataset
    format: cmapss
    data_dir: datasets/cmapss
    train_file: train_FD001.txt
    test_file: test_FD001.txt
    rul_file: RUL_FD001.txt
    window: 30
    stride: 1
    max_rul: 125
    train_last_frac: 0.5
    auto_select: true
    standardize: true
    feat_eng: [roll_mean, slope]
    roll_window: 10
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256
    num_workers: 0
