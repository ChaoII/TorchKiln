# DeepAR demo(概率预测,Gaussian NLL)。验证 NLL 损失路径。
Global:
  model_name: deepar-demo
  use_gpu: true
  device: cuda:0
  epoch_num: 20
  print_batch_step: 10
  save_model_dir: ./output/ts_deepar_demo
  save_epoch_step: 10
  eval_batch_step: [0, 2000]
  eval_epoch_step: 1
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: false
  show_eval_progress: true
Architecture:
  model_family: ts_forecast
  task: ts_forecast
  train: true
  Head:
    model: deepar
    rnn_type: LSTM
    in_chunk_len: 48
    out_chunk_len: 12
    target_dim: 1
    hidden_dim: 32
    num_samples: 10
Loss:
  type: nll
Metric:
  pred_mode: params
Optimizer:
  name: AdamW
  lr:
    name: Cosine
    learning_rate: 0.001
    lrf: 0.05
    warmup_epoch: 1
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    csv_path: datasets/ts_demo/data.csv
    target_cols: [signal]
    in_chunk_len: 48
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    batch_size_per_card: 16
    shuffle: true
    drop_last: false
    num_workers: 0
Eval:
  dataset:
    csv_path: datasets/ts_demo/data.csv
    target_cols: [signal]
    in_chunk_len: 48
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    batch_size_per_card: 16
    shuffle: false
    drop_last: false
    num_workers: 0
