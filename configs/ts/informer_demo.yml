# Informer demo(ProbSparse 注意力, MSE)。
Global:
  model_name: informer_demo
  use_gpu: true
  device: cuda:0
  epoch_num: 20
  print_batch_step: 10
  save_model_dir: ./output/ts_informer_demo
  save_epoch_step: 10
  eval_batch_step: [0, 2000]
  eval_epoch_step: 1
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: false
  show_eval_progress: true
Architecture:
  model_family: ts_forecast
  task: ts_forecast
  train: true
  Head:
    model: informer
    in_chunk_len: 48
    out_chunk_len: 12
    target_dim: 1
    start_token_len: 12
    d_model: 32
    nhead: 4
    ffn_channels: 64
    num_encoder_layers: 1
    num_decoder_layers: 1
    activation: relu
    dropout_rate: 0.0
Loss:
  type: mse
Metric:
  pred_mode: point
Optimizer:
  name: AdamW
  lr:
    name: Cosine
    learning_rate: 0.001
    lrf: 0.05
    warmup_epoch: 1
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    csv_path: datasets/ts_demo/data.csv
    target_cols: [signal]
    in_chunk_len: 48
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    batch_size_per_card: 16
    shuffle: true
    drop_last: false
    num_workers: 0
Eval:
  dataset:
    csv_path: datasets/ts_demo/data.csv
    target_cols: [signal]
    in_chunk_len: 48
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    batch_size_per_card: 16
    shuffle: false
    drop_last: false
    num_workers: 0
