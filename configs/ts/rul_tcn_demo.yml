# RUL（剩余寿命预测）demo —— NASA C-MAPSS FD001（涡扇发动机退化）
# 数据: datasets/cmapss/{train,test,RUL}_FD001.txt（GitHub 代理 jsDelivr 下载）
# 模型复用 ts_forecast 的模型族（这里用 tcn），out_chunk_len 固定为 1。
Global:
  model_name: ts-rul-tcn-demo
  use_gpu: true
  device: cuda:0
  epoch_num: 60
  main_indicator_mode: min    # ⚠️ RMSE 越小越好（缺省 max）
  print_batch_step: 40
  save_model_dir: ./output/ts_rul_tcn_demo
  save_epoch_step: 60
  eval_batch_step: null
  eval_epoch_step: 2
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: false
  show_eval_progress: false
Architecture:
  model_family: ts_rul
  task: ts_rul
  train: true
  Head:
    model: tcn
    in_chunk_len: 30
    out_chunk_len: 1
    hidden_dim: 128
    num_layers: 3
    kernel_size: 3
    dropout: 0.1
Loss:
  type: mse
  asymmetric_weight: 0.0    # >0 时加大对「高估剩余寿命」的惩罚（与 NASA Score 取向一致）
  reduce: mean               # 多通道集成：等价每个传感器通道各预测一次 RUL 再取均值
Metric:
  main_indicator: RMSE
  score_tol: 10
  reduce: mean
Optimizer:
  name: Adam
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    name: RULDataset
    format: cmapss
    data_dir: datasets/cmapss
    train_file: train_FD001.txt
    test_file: test_FD001.txt
    rul_file: RUL_FD001.txt
    window: 30
    stride: 1
    max_rul: 125                # 分段线性截断（业界标准）
    train_last_frac: 0.5        # 训练只用每条轨迹后 50% 窗口（贴合 test 只取末尾的口径）
    auto_select: true           # 自动筛掉常量/无信息传感器（24 -> 17）
    feat_eng: [roll_mean]       # 特征工程：滚动均值（实测 RMSE 28.0 -> 26.7）
    roll_window: 10
    standardize: true
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 256
    num_workers: 0
Eval:
  dataset:
    name: RULDataset
    format: cmapss
    data_dir: datasets/cmapss
    train_file: train_FD001.txt
    test_file: test_FD001.txt
    rul_file: RUL_FD001.txt
    window: 30
    stride: 1
    max_rul: 125
    train_last_frac: 0.5
    auto_select: true
    feat_eng: [roll_mean]
    roll_window: 10
    standardize: true
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256
    num_workers: 0
