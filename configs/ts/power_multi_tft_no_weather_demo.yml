# 多工况功率预测（no_weather）—— TFT + 协变量
# 【单工况】只用时刻特征，无 weather -> 模型无法区分晴/多云
Global:
  model_name: ts-pm-tft-no_weather
  use_gpu: true
  device: cuda:0
  epoch_num: 30
  print_batch_step: 50
  save_model_dir: ./output/ts_pm_tft_no_weather
  save_epoch_step: 30
  eval_batch_step: null
  eval_epoch_step: 1
  seed: 1024
  use_ema: false
  show_eval_progress: false
Architecture:
  model_family: ts_forecast
  task: ts_forecast
  train: true
  Head:
    model: tft
    in_chunk_len: 96
    out_chunk_len: 12
    target_dim: 1
    hidden_dim: 32
    num_heads: 2
    num_layers: 1
    dropout: 0.1
    num_quantiles: 3
    known_num_dim: 2
    observed_num_dim: 2
Loss:
  type: quantile
Metric:
  main_indicator: nRMSE
  pred_mode: quantile
  quantiles: [0.1, 0.5, 0.9]
  nominal_coverage: 0.8
Optimizer:
  name: Adam
  lr:
    name: Const
    learning_rate: 0.002
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    csv_path: datasets/ts_power_multi/data.csv
    target_cols: [power]
    known_cols: [hour_sin, hour_cos]
    observed_cols: [irradiance, temp]
    in_chunk_len: 96
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 64
    num_workers: 0
Eval:
  dataset:
    csv_path: datasets/ts_power_multi/data.csv
    target_cols: [power]
    known_cols: [hour_sin, hour_cos]
    observed_cols: [irradiance, temp]
    in_chunk_len: 96
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 0
