# 功率预测 demo（tft）—— 合成光伏数据 datasets/ts_power_demo/data.csv
# 示范：点预测 + 区间预测(分位数) + 功率预测常用指标（nRMSE / MAPE / R² / PICP/MPIW/pinball）
Global:
  model_name: ts-power-tft-demo
  use_gpu: true
  device: cuda:0
  epoch_num: 10
  print_batch_step: 20
  save_model_dir: ./output/ts_power_tft_demo
  save_epoch_step: 10
  eval_batch_step: null
  eval_epoch_step: 1
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: false
  show_eval_progress: false
Architecture:
  model_family: ts_forecast
  task: ts_forecast
  train: true
  Head:
    model: tft
    in_chunk_len: 96
    out_chunk_len: 12
    target_dim: 1
    hidden_dim: 32
    n_heads: 2
    num_layers: 1
    dropout: 0.1
    num_quantiles: 3
    output_quantiles: [0.1, 0.5, 0.9]
    known_num_dim: 2
    observed_num_dim: 2
Loss:
  type: quantile
Metric:
  main_indicator: nRMSE
  pred_mode: quantile
  quantiles: [0.1, 0.5, 0.9]   # 与 TFT 的 num_quantiles 一致
  nominal_coverage: 0.8
Optimizer:
  name: Adam
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    csv_path: datasets/ts_power_demo/data.csv
    target_cols: [power]
    known_cols: [hour_sin, hour_cos]
    observed_cols: [irradiance, temp]
    in_chunk_len: 96
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
Eval:
  dataset:
    csv_path: datasets/ts_power_demo/data.csv
    target_cols: [power]
    known_cols: [hour_sin, hour_cos]
    observed_cols: [irradiance, temp]
    in_chunk_len: 96
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
