# 多工况功率预测 demo（no_weather）—— 合成光伏（晴/多云 两种工况）
# 【单工况口径】不把天气作为协变量 -> 模型无法区分晴/多云
Global:
  model_name: ts-power-multi-no_weather
  use_gpu: true
  device: cuda:0
  epoch_num: 30
  print_batch_step: 50
  save_model_dir: ./output/ts_power_multi_no_weather
  save_epoch_step: 30
  eval_batch_step: null
  eval_epoch_step: 1
  seed: 1024
  use_ema: false
  show_eval_progress: false
Architecture:
  model_family: ts_forecast
  task: ts_forecast
  train: true
  Head:
    model: rnn
    rnn_type: LSTM
    in_chunk_len: 96
    out_chunk_len: 12
    target_dim: 1
    hidden_dim: 64
Loss:
  type: mse
Metric:
  main_indicator: nRMSE
  pred_mode: point
Optimizer:
  name: Adam
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    csv_path: datasets/ts_power_multi/data.csv
    target_cols: [power]
    known_cols: [hour_sin, hour_cos]
    observed_cols: [irradiance, temp]
    in_chunk_len: 96
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 64
    num_workers: 0
Eval:
  dataset:
    csv_path: datasets/ts_power_multi/data.csv
    target_cols: [power]
    known_cols: [hour_sin, hour_cos]
    observed_cols: [irradiance, temp]
    in_chunk_len: 96
    out_chunk_len: 12
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 0
