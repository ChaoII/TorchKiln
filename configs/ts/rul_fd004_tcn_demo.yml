# RUL demo —— NASA C-MAPSS FD004（6 种工况 · 2 种故障）
# 模型复用 ts_forecast 的模型族（这里用 tcn）
Global:
  model_name: ts-rul-fd004-tcn
  use_gpu: true
  device: cuda:0
  epoch_num: 60
  main_indicator_mode: min
  print_batch_step: 100
  save_model_dir: ./output/ts_rul_fd004_tcn
  save_epoch_step: 60
  eval_batch_step: null
  eval_epoch_step: 2
  pretrained_model: null
  checkpoints: null
  distributed: false
  seed: 1024
  use_ema: false
  show_eval_progress: false
Architecture:
  model_family: ts_rul
  task: ts_rul
  train: true
  Head:
    model: tcn
    in_chunk_len: 30
    out_chunk_len: 1
    hidden_dim: 128
    num_layers: 3
    kernel_size: 3
    dropout: 0.1
Loss:
  type: mse
  asymmetric_weight: 0.0
  reduce: mean
Metric:
  main_indicator: RMSE
  score_tol: 10
  reduce: mean
Optimizer:
  name: Adam
  lr:
    name: Const
    learning_rate: 0.001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.0
Train:
  dataset:
    name: RULDataset
    format: cmapss
    data_dir: datasets/cmapss
    train_file: train_FD004.txt
    test_file: test_FD004.txt
    rul_file: RUL_FD004.txt
    window: 30
    stride: 1
    max_rul: 125
    train_last_frac: 0.5
    auto_select: true
    standardize: true
    # ⭐ 多工况（FD002/004）：按操作条件聚类后**分组归一化**
    n_op_cols: 3
    op_round: 2
    min_op_frac: 0.02
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 256
    num_workers: 0
Eval:
  dataset:
    name: RULDataset
    format: cmapss
    data_dir: datasets/cmapss
    train_file: train_FD004.txt
    test_file: test_FD004.txt
    rul_file: RUL_FD004.txt
    window: 30
    stride: 1
    max_rul: 125
    train_last_frac: 0.5
    auto_select: true
    standardize: true
    n_op_cols: 3
    op_round: 2
    min_op_frac: 0.02
    split_ratio: [0.7, 0.15, 0.15]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256
    num_workers: 0
