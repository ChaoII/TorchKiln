Global:
  model_name: PP-OCRv6_medium_rec
  debug: false
  use_gpu: true
  device: null
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/PP-OCRv6_medium_rec
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 2000
  cal_metric_during_train: true
  pretrained_model: https://www.modelscope.cn/models/ChaoII0987/PytorchOCR/resolve/master/pretrained/PP-OCRv6_medium_rec_ptocr.pth
  checkpoints: null
  save_inference_dir: null
  output: null
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: datasets/ocr_rec_dataset_examples/dict.txt
  max_text_length: 25
  infer_mode: false
  use_space_char: true
  distributed: false
  dist_backend: null
  dist_init_method: null
  seed: 1024
  use_ema: false
  ema_decay: 0.9998
  ema_decay_type: threshold
  show_eval_progress: true
  amp: false
  save_res_path: ./output/rec/predicts_ppocrv6_medium.txt
  d2s_train_image_shape: &id001
  - 3
  - 48
  - 320
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: lightsvtr
          dims: 192
          depth: 2
          mlp_ratio: 4.0
          local_kernel: 7
          use_guide: false
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 512
        max_text_length: 25
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: datasets/ocr_rec_dataset_examples
    ext_op_transform_idx: 1
    label_file_list:
    - datasets/ocr_rec_dataset_examples/train.txt
    ratio_list:
    - 1.0
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape:
        - 48
        - 320
        - 3
        max_text_length: 25
    - RecAug: null
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: *id001
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    batch_size_per_card: 64
    drop_last: true
    num_workers: 4
    shuffle: true
    prefetch_factor: 4
  resume_path: null
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: datasets/ocr_rec_dataset_examples
    label_file_list:
    - datasets/ocr_rec_dataset_examples/val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
    ratio_list:
    - 1.0
    ext_op_transform_idx: 1
  loader:
    drop_last: false
    batch_size_per_card: 128
    num_workers: 0
    shuffle: false
    prefetch_factor: 4
