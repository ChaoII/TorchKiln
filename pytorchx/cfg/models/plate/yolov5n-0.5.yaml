# Parameters
nc: 2  # number of classes: 0 single-layer plate, 1 double-layer plate
depth_multiple: 1.0  # model depth multiple
width_multiple: 0.5  # layer channel multiple
kpt_label: 4  # 4 plate corners (yolov5-face style landmark head)

# Anchors (pixels, evaluated at 640x640 like upstream)
anchors:
  - [4, 5, 8, 10, 13, 16]  # P3/8
  - [23, 29, 43, 55, 73, 105]  # P4/16
  - [146, 217, 231, 300, 335, 433]  # P5/32

# yolov5-lite (ShuffleNetV2) backbone
backbone:
  [
    [-1, 1, StemBlock, [32, 3, 2]],  # 0-P2/4
    [-1, 1, ShuffleV2Block, [128, 2]],  # 1-P3/8
    [-1, 3, ShuffleV2Block, [128, 1]],  # 2
    [-1, 1, ShuffleV2Block, [256, 2]],  # 3-P4/16
    [-1, 7, ShuffleV2Block, [256, 1]],  # 4
    [-1, 1, ShuffleV2Block, [512, 2]],  # 5-P5/32
    [-1, 3, ShuffleV2Block, [512, 1]],  # 6
  ]

# YOLOv5 head (C3V5 = the two-3x3 YOLOv5 C3 used by the released weights)
head:
  [
    [-1, 1, Conv, [128, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],  # cat backbone P4
    [-1, 1, C3V5, [128, False]],  # 10
    [-1, 1, Conv, [128, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 2], 1, Concat, [1]],  # cat backbone P3
    [-1, 1, C3V5, [128, False]],  # 14 (P3/8-small)
    [-1, 1, Conv, [128, 3, 2]],
    [[-1, 11], 1, Concat, [1]],  # cat head P4
    [-1, 1, C3V5, [128, False]],  # 17 (P4/16-medium)
    [-1, 1, Conv, [128, 3, 2]],
    [[-1, 7], 1, Concat, [1]],  # cat head P5
    [-1, 1, C3V5, [128, False]],  # 20 (P5/32-large)
    [[14, 17, 20], 1, Detect, [nc, anchors]],  # PlateDetect(P3, P4, P5)
  ]
